# Requires the Tailscale Kubernetes operator, installed in the `tailscale` namespace.
# Tailnet only: funnel is disabled, so there is no public route.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: round-trip-backend
  annotations:
    tailscale.com/funnel: "false"   # never expose publicly
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: round-trip-backend
      port:
        name: http
  tls:
    - hosts:
        - round-trip   # becomes round-trip.<tailnet>.ts.net with HTTPS
