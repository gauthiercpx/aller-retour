apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Set here, not in the manifests, so renaming the namespace is a one-line change.
namespace: round-trip

resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - cloudflared.yaml
  # Needs the Tailscale Kubernetes operator (installed in the `tailscale` namespace).
  - tailscale-ingress.yaml

images:
  # The only line CI changes to deploy a new version (workflow backend.yml); ArgoCD sees the
  # commit and replaces the pod. Rolling back is putting the previous tag back or `git revert`.
  - name: ghcr.io/gauthiercpx/round-trip-backend
    newTag: "sha-8e31b98"

# The secret round-trip-secrets is NOT here: it must not live in git (the repo is public).
# See secret.example.yaml and README.md.

# Generated rather than declared: kustomize suffixes the name with a content hash, so a routing
# change renames the ConfigMap, which changes the pod's volume and restarts cloudflared (it only
# reads its configuration at start).
configMapGenerator:
  - name: cloudflared
    files:
      - config.yaml=cloudflared-config.yaml
