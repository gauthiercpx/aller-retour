name: android

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "core/**"
      - "build-logic/**"
      - "config/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - ".editorconfig"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "app/**"
      - "core/**"
      - "build-logic/**"
      - "config/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - ".editorconfig"
      - ".github/workflows/android.yml"

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # No signing and no secrets: pull requests only ever build the debug variant.
      - name: Quality gates, unit tests, debug build
        run: >
          ./gradlew
          spotlessCheck detekt
          :app:lintDebug
          :core:model:test :core:ui:testDebugUnitTest :app:testDebugUnitTest
          :app:assembleDebug
          --continue

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: round-trip-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
