# Tests, then builds and publishes the backend image, then records the published tag in
# deploy/kustomization.yaml so ArgoCD deploys exactly that image.
# Same shape as the larouedugras server workflow: nothing is published if tests fail.
name: backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/round-trip-backend

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Tests
        working-directory: backend
        run: ./gradlew test --console=plain

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/**/build/reports/tests/
          retention-days: 7

  image:
    needs: test
    # Pull requests get a read-only token and must not publish to the registry.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      # write: the workflow commits the published tag into deploy/kustomization.yaml.
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # sha-xxxxxxx is the tag that matters: immutable, so a GitOps deploy is reproducible.
          # Do not reference latest or the branch name from kustomization.yaml; they move.
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record the deployed tag in the repo
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          TAG="sha-${GITHUB_SHA::7}"
          sed -i "/round-trip-backend\$/{n;s|newTag: .*|newTag: \"${TAG}\"|}" deploy/kustomization.yaml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/kustomization.yaml
          if git diff --staged --quiet; then
            echo "already up to date"
            exit 0
          fi
          git commit -m "build(deploy): deploy round-trip-backend ${TAG}"

          # The Android workflow or another run may push at the same time: rebase and retry.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git pull --rebase origin main
          done
          echo "could not push the tag after three attempts" >&2
          exit 1
